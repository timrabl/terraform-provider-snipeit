---
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, go]
    commit-message:
      prefix: chore(deps)
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, github-actions]
    commit-message:
      prefix: ci(deps)

  - package-ecosystem: docker-compose
    directory: /dev
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    commit-message:
      prefix: chore(deps)
    # The dev stack mirrors the Snipe-IT production deployments this provider
    # is tested against; major image bumps are a deliberate decision.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
