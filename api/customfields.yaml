openapi: 3.0.3
info:
  title: Snipe-IT API — customfields domain (corrected)
  version: 8.0.4
  description: |
    Corrected, live-verified spec for the customfields domain: custom fields,
    fieldsets and their association. Derived from real responses of Snipe-IT
    v8.0.4 — NOT from the flawed upstream spec.

    Transport quirks (handled by internal/client, not modeled here):
    - Mutations (POST/PATCH/DELETE) and all errors — including "not found" —
      return HTTP 200 with an envelope {status: success|error, messages,
      payload}. Success must be read from the envelope.
    - Create responses carry only a partial payload (submitted fields + id);
      callers must re-GET for the full object.

    Domain quirks (all live-verified on v8.0.4):
    - A field's form element is returned under the key `type`, not `element`.
    - `help_text` and `show_in_email` are WRITE-ONLY: accepted on create and
      update but never echoed back by any read endpoint.
    - Custom regex formats (`CUSTOM REGEX` / `regex:...`) are silently
      discarded and stored as `ANY`; only 13 preset formats round-trip
      (ANY, ALPHA, ALPHA-DASH, NUMERIC, ALPHA-NUMERIC, EMAIL, DATE, URL, IP,
      IPV4, IPV6, MAC, BOOLEAN).
    - `db_column_name` is derived server-side from the field name and changes
      when the field is renamed.
    - A fieldset's member fields are embedded in the fieldset detail response
      under `fields.rows`; the dedicated GET /fieldsets/{id}/fields endpoint
      404s and is intentionally not modeled here.
    - Fieldsets accept PATCH fine despite the upstream spec listing only PUT.

    Request bodies are intentionally NOT modeled as schemas: the provider
    builds them as maps because clear-on-unset semantics differ per field.
servers:
  - url: /api/v1
tags:
  - name: fields
  - name: fieldsets
paths:
  /fields:
    get:
      tags: [fields]
      summary: List custom fields
      responses:
        "200":
          description: Field list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldList" }
    post:
      tags: [fields]
      summary: Create a custom field (enveloped response, partial payload)
      responses:
        "200": { description: Envelope with payload.id }
  /fields/{id}:
    get:
      tags: [fields]
      summary: Get one custom field (raw object, element under `type`)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: Field detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Field" }
    patch:
      tags: [fields]
      summary: Partially update a custom field (enveloped response)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Envelope }
    delete:
      tags: [fields]
      summary: Delete a custom field (enveloped response)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Envelope }
  /fields/{id}/associate:
    post:
      tags: [fields]
      summary: >-
        Add the field to a fieldset (body {fieldset_id}); enveloped response.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Envelope }
  /fields/{id}/disassociate:
    post:
      tags: [fields]
      summary: >-
        Remove the field from a fieldset (body {fieldset_id}); enveloped
        response.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Envelope }
  /fieldsets:
    get:
      tags: [fieldsets]
      summary: List fieldsets (no ?search= support; filter client-side)
      responses:
        "200":
          description: Fieldset list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldsetList" }
    post:
      tags: [fieldsets]
      summary: Create a fieldset (enveloped response, partial payload)
      responses:
        "200": { description: Envelope with payload.id }
  /fieldsets/{id}:
    get:
      tags: [fieldsets]
      summary: >-
        Get one fieldset (raw object). Member fields are embedded under
        fields.rows — the dedicated /fieldsets/{id}/fields endpoint 404s.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: Fieldset detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fieldset" }
    patch:
      tags: [fieldsets]
      summary: >-
        Partially update a fieldset (enveloped response). Works despite the
        upstream spec listing only PUT.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Envelope }
    delete:
      tags: [fieldsets]
      summary: Delete a fieldset (enveloped response)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Envelope }
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    FlexBool:
      description: Boolean the API returns as true/false, 0/1 or "0"/"1".
      type: boolean
      x-go-type: client.FlexBool
      x-go-type-import:
        path: github.com/timrabl/terraform-provider-snipeit/internal/client
    Field:
      type: object
      description: >-
        Custom field detail. The form element is exposed under `type`;
        help_text and show_in_email are write-only and never appear here.
      required: [id, name, db_column_name, format, type]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        db_column_name:
          type: string
          description: Server-derived from the name; changes on rename.
        format:
          type: string
          description: One of the 13 presets; regexes are stored as ANY.
        field_values:
          type: string
          nullable: true
          description: Selectable values, one per line.
        type:
          type: string
          x-go-name: Element
          description: Form element (text, textarea, listbox, checkbox, radio).
    FieldList:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: "#/components/schemas/Field" }
    FieldsetField:
      type: object
      description: A field row as embedded in a fieldset detail response.
      required: [id, name, db_column_name, format, type, required]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        db_column_name: { type: string }
        format: { type: string }
        type:
          type: string
          x-go-name: Element
        required:
          $ref: "#/components/schemas/FlexBool"
    FieldsetFieldList:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/FieldsetField" }
    Fieldset:
      type: object
      required: [id, name, fields]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        fields:
          $ref: "#/components/schemas/FieldsetFieldList"
    FieldsetList:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: "#/components/schemas/Fieldset" }
