openapi: 3.0.3
info:
  title: Snipe-IT API — people domain (corrected)
  version: 8.0.4
  description: |
    Corrected, live-verified spec for the people domain: users and permission
    groups. Derived from real responses of Snipe-IT v8.0.4 — NOT from the
    flawed upstream spec.

    Transport quirks (handled by internal/client, not modeled here):
    - Mutations (POST/PATCH/DELETE) and all errors — including "not found" —
      return HTTP 200 with an envelope {status: success|error, messages,
      payload}. Success must be read from the envelope.
    - Create responses carry only a partial payload (submitted fields + id);
      callers must re-GET for the full object.
    - The API rate limiter answers HTTP 429; the transport retries.

    Domain quirks (live-verified on v8.0.4):
    - The user password is strictly write-only: sent as password +
      password_confirmation on create/update, never returned by any endpoint.
    - Group updates that include a permissions map return HTTP 500
      "Server Error" but ARE applied; the provider verifies server state
      after such errors. Group PATCH requires name even for permission-only
      changes.
    - A group created without permissions gets a server-generated full
      default map (every permission "0"); updates replace the stored map
      entirely.

    Request bodies are intentionally NOT modeled as full schemas: the
    provider builds them as maps because clear-on-unset semantics differ per
    field. The one documented exception is UserWriteBody, which exists to
    document the write-only password contract.
servers:
  - url: /api/v1
tags:
  - name: users
  - name: groups
paths:
  /users:
    get:
      tags: [users]
      summary: List users (supports ?search= and ?limit=/offset=)
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
    post:
      tags: [users]
      summary: Create a user (enveloped response, partial payload)
      requestBody:
        description: >-
          Documentation-only schema: the provider builds request maps. Shown
          here to document the write-only password contract.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserWriteBody" }
      responses:
        "200": { description: Envelope with payload.id }
  /users/{id}:
    get:
      tags: [users]
      summary: Get one user (raw object, no envelope; never includes password)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    patch:
      tags: [users]
      summary: Partially update a user (enveloped response)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Envelope }
    delete:
      tags: [users]
      summary: >-
        Delete a user (enveloped response). Users with assigned assets,
        accessories or licenses cannot be deleted.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Envelope }
  /users/me:
    get:
      tags: [users]
      summary: Get the user owning the API token (raw object)
      responses:
        "200":
          description: Current user detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
  /groups:
    get:
      tags: [groups]
      summary: List groups
      responses:
        "200":
          description: Group list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupList" }
    post:
      tags: [groups]
      summary: Create a group (enveloped response, partial payload)
      responses:
        "200": { description: Envelope with payload.id }
  /groups/{id}:
    get:
      tags: [groups]
      summary: Get one group (raw object)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: Group detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
    patch:
      tags: [groups]
      summary: >-
        Partially update a group (enveloped response). QUIRK: including
        permissions returns HTTP 500 even though the update is applied, and
        name is required even for permission-only changes.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Envelope }
        "500": { description: Returned when permissions are included, update is applied anyway }
    delete:
      tags: [groups]
      summary: Delete a group (enveloped response)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Envelope }
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    NestedRef:
      description: 'Nested related-object reference, e.g. {"id": 3, "name": "X"}.'
      type: object
      x-go-type: client.Ref
      x-go-type-import:
        path: github.com/timrabl/terraform-provider-snipeit/internal/client
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    UserGroups:
      description: Group memberships of a user as returned inline on the user object.
      type: object
      required: [rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: "#/components/schemas/NestedRef" }
    User:
      type: object
      required: [id, username, first_name, activated]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        first_name: { type: string }
        last_name: { type: string, nullable: true }
        email: { type: string, nullable: true }
        employee_num: { type: string, nullable: true }
        jobtitle: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        company: { $ref: "#/components/schemas/NestedRef" }
        department: { $ref: "#/components/schemas/NestedRef" }
        location: { $ref: "#/components/schemas/NestedRef" }
        manager: { $ref: "#/components/schemas/NestedRef" }
        activated: { type: boolean }
        groups: { $ref: "#/components/schemas/UserGroups" }
    UserList:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: "#/components/schemas/User" }
    UserWriteBody:
      description: >-
        Documentation-only model of the user create/update body. The provider
        builds request maps (clear-on-unset semantics per field); this schema
        exists to document the write-only password contract.
      type: object
      required: [username, first_name]
      properties:
        username: { type: string }
        first_name: { type: string }
        password:
          type: string
          writeOnly: true
          description: >-
            Write-only. Required by the API on create, never returned by any
            endpoint. Sent together with password_confirmation.
        password_confirmation:
          type: string
          writeOnly: true
          description: Write-only, must equal password.
        groups:
          type: array
          description: Written as a plain array of group ids (read shape differs, see UserGroups).
          items: { type: integer, format: int64 }
    Group:
      type: object
      required: [id, name, permissions]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        notes: { type: string, nullable: true }
        permissions:
          description: >-
            Stored permission map, values "1" (allow), "0" (inherit/deny) or
            "-1" (explicit deny). Groups created without permissions get a
            server-generated full default map.
          type: object
          additionalProperties: { type: string }
    GroupList:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: "#/components/schemas/Group" }
