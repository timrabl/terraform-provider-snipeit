openapi: 3.0.3
info:
  title: Snipe-IT API — assets domain (corrected)
  version: 8.0.4
  description: |
    Corrected, live-verified spec for the assets domain: manufacturers,
    categories, status labels, asset models, hardware (assets). Derived from
    real responses of Snipe-IT v8.0.4 — NOT from the flawed upstream spec.

    Transport quirks (handled by internal/client, not modeled here):
    - Mutations (POST/PATCH/DELETE) and all errors — including "not found" —
      return HTTP 200 with an envelope {status: success|error, messages,
      payload}. Success must be read from the envelope.
    - Create responses carry only a partial payload (submitted fields + id);
      callers must re-GET for the full object.
    - The API rate limiter answers HTTP 429; the transport retries.

    Decorated values in this domain (modeled via x-go-type quirk schemas):
    - model.eol comes back as "24 mo." / "24" / 24 (FlexInt)
    - hardware.warranty_months comes back as "24 months" / 24 / null (FlexInt)
    - hardware.purchase_date is {date, formatted} or null (NestedDate)
    - booleans (requestable, eula flags, show_in_nav, ...) come back as
      true/false, 0/1 or "0"/"1" (FlexBool)

    Request bodies are intentionally NOT modeled as schemas: the provider
    builds them as maps because clear-on-unset semantics differ per field
    (strings clear with "", references and dates clear with explicit JSON
    null, omitted keys keep the server value). Write-mapping notes:
    - hardware's default location is WRITTEN as rtd_location_id but READ as
      the rtd_location nested reference.
    - purchase_cost is deliberately unmodeled everywhere: the API returns it
      locale-formatted and it cannot round-trip stably.
servers:
  - url: /api/v1
tags:
  - name: manufacturers
  - name: categories
  - name: statuslabels
  - name: models
  - name: hardware
paths:
  /manufacturers:
    get:
      tags: [manufacturers]
      summary: List manufacturers (supports ?search= and ?limit=/offset=)
      responses:
        "200":
          description: Manufacturer list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturerList" }
    post:
      tags: [manufacturers]
      summary: Create a manufacturer (enveloped response, partial payload)
      responses:
        "200": { description: Envelope with payload.id }
  /manufacturers/{id}:
    get:
      tags: [manufacturers]
      summary: Get one manufacturer (raw object, no envelope)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: Manufacturer detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Manufacturer" }
    patch:
      tags: [manufacturers]
      summary: Partially update a manufacturer (enveloped response)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Envelope }
    delete:
      tags: [manufacturers]
      summary: Delete a manufacturer (enveloped response)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Envelope }
  /categories:
    get:
      tags: [categories]
      summary: List categories
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryList" }
    post:
      tags: [categories]
      summary: >-
        Create a category (enveloped response, partial payload). category_type
        is one of asset, accessory, consumable, component, license.
      responses:
        "200": { description: Envelope with payload.id }
  /categories/{id}:
    get:
      tags: [categories]
      summary: >-
        Get one category (raw object). NOTE: eula_text is write-only — the
        serializer never returns it.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: Category detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
    patch:
      tags: [categories]
      summary: Partially update a category (enveloped response)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Envelope }
    delete:
      tags: [categories]
      summary: Delete a category (enveloped response)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Envelope }
  /statuslabels:
    get:
      tags: [statuslabels]
      summary: List status labels
      responses:
        "200":
          description: Status label list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusLabelList" }
    post:
      tags: [statuslabels]
      summary: >-
        Create a status label (enveloped response, partial payload). type is
        one of deployable, pending, undeployable, archived.
      responses:
        "200": { description: Envelope with payload.id }
  /statuslabels/{id}:
    get:
      tags: [statuslabels]
      summary: Get one status label (raw object)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: Status label detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusLabel" }
    patch:
      tags: [statuslabels]
      summary: Partially update a status label (enveloped response)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Envelope }
    delete:
      tags: [statuslabels]
      summary: Delete a status label (enveloped response)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Envelope }
  /models:
    get:
      tags: [models]
      summary: List asset models
      responses:
        "200":
          description: Model list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelList" }
    post:
      tags: [models]
      summary: Create an asset model (enveloped response, partial payload)
      responses:
        "200": { description: Envelope with payload.id }
  /models/{id}:
    get:
      tags: [models]
      summary: Get one asset model (raw object; eol arrives as "24 mo.")
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: Model detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model" }
    patch:
      tags: [models]
      summary: Partially update an asset model (enveloped response)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Envelope }
    delete:
      tags: [models]
      summary: Delete an asset model (enveloped response)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Envelope }
  /hardware:
    get:
      tags: [hardware]
      summary: List assets
      responses:
        "200":
          description: Asset list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HardwareList" }
    post:
      tags: [hardware]
      summary: >-
        Create an asset (enveloped response, partial payload). The default
        location is written as rtd_location_id.
      responses:
        "200": { description: Envelope with payload.id }
  /hardware/{id}:
    get:
      tags: [hardware]
      summary: Get one asset (raw object)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: Asset detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hardware" }
    patch:
      tags: [hardware]
      summary: Partially update an asset (enveloped response)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Envelope }
    delete:
      tags: [hardware]
      summary: Delete an asset (enveloped response)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Envelope }
  /hardware/bytag/{asset_tag}:
    get:
      tags: [hardware]
      summary: Get one asset by its asset tag (raw object)
      parameters:
        - name: asset_tag
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Asset detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hardware" }
  /hardware/byserial/{serial}:
    get:
      tags: [hardware]
      summary: >-
        Find assets by serial number. NOTE: unlike /bytag/, this returns a
        LIST shape {total, rows}, live-verified.
      parameters:
        - name: serial
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Matching assets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HardwareList" }
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    NestedRef:
      description: 'Nested related-object reference, e.g. {"id": 3, "name": "X"}.'
      type: object
      x-go-type: client.Ref
      x-go-type-import:
        path: github.com/timrabl/terraform-provider-snipeit/internal/client
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    NestedDate:
      description: 'Nested date, e.g. {"date": "2026-01-15", "formatted": "..."}.'
      type: object
      x-go-type: client.Date
      x-go-type-import:
        path: github.com/timrabl/terraform-provider-snipeit/internal/client
      properties:
        date: { type: string }
        formatted: { type: string }
    NestedDateTime:
      description: 'Nested timestamp, e.g. {"datetime": "2026-01-15 12:00:00", "formatted": "..."}.'
      type: object
      x-go-type: client.DateTime
      x-go-type-import:
        path: github.com/timrabl/terraform-provider-snipeit/internal/client
      properties:
        datetime: { type: string }
        formatted: { type: string }
    FlexInt:
      description: >-
        Integer that the API may serialize as 24, "24", "24 mo." or
        "24 months"; null decodes to 0.
      type: integer
      format: int64
      x-go-type: client.FlexInt
      x-go-type-import:
        path: github.com/timrabl/terraform-provider-snipeit/internal/client
    FlexBool:
      description: Boolean that the API may serialize as true/false, 0/1 or "0"/"1".
      type: boolean
      x-go-type: client.FlexBool
      x-go-type-import:
        path: github.com/timrabl/terraform-provider-snipeit/internal/client
    Manufacturer:
      type: object
      description: >-
        Plain-string fields (url, support_*) are always present; the API sends
        "" or null interchangeably for unset — both decode to the empty string.
      required: [id, name, url, support_url, warranty_lookup_url, support_phone, support_email]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        url: { type: string }
        support_url: { type: string }
        warranty_lookup_url: { type: string }
        support_phone: { type: string }
        support_email: { type: string }
        notes: { type: string, nullable: true }
    ManufacturerList:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: "#/components/schemas/Manufacturer" }
    Category:
      type: object
      description: >-
        category_type arrives capitalized ("Asset"); the provider normalizes
        to lowercase. eula_text is write-only and never returned.
      required: [id, name, category_type, eula, use_default_eula, require_acceptance, checkin_email]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        category_type: { type: string }
        eula: { $ref: "#/components/schemas/FlexBool" }
        use_default_eula: { $ref: "#/components/schemas/FlexBool" }
        require_acceptance: { $ref: "#/components/schemas/FlexBool" }
        checkin_email: { $ref: "#/components/schemas/FlexBool" }
        notes: { type: string, nullable: true }
    CategoryList:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: "#/components/schemas/Category" }
    StatusLabel:
      type: object
      description: type arrives capitalized; the provider normalizes to lowercase.
      required: [id, name, type, show_in_nav, default_label]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type: { type: string }
        color: { type: string, nullable: true }
        show_in_nav: { $ref: "#/components/schemas/FlexBool" }
        default_label: { $ref: "#/components/schemas/FlexBool" }
        notes: { type: string, nullable: true }
    StatusLabelList:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: "#/components/schemas/StatusLabel" }
    Model:
      type: object
      required: [id, name, eol, min_amt, requestable]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        model_number: { type: string, nullable: true }
        category: { $ref: "#/components/schemas/NestedRef" }
        manufacturer: { $ref: "#/components/schemas/NestedRef" }
        fieldset: { $ref: "#/components/schemas/NestedRef" }
        eol: { $ref: "#/components/schemas/FlexInt" }
        min_amt: { $ref: "#/components/schemas/FlexInt" }
        requestable: { $ref: "#/components/schemas/FlexBool" }
        notes: { type: string, nullable: true }
    ModelList:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: "#/components/schemas/Model" }
    Hardware:
      type: object
      description: >-
        The default (ready-to-deploy) location is READ as rtd_location but
        WRITTEN as rtd_location_id.
      required: [id, asset_tag, warranty_months, requestable]
      properties:
        id: { type: integer, format: int64 }
        asset_tag: { type: string }
        name: { type: string, nullable: true }
        serial: { type: string, nullable: true }
        order_number: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        model: { $ref: "#/components/schemas/NestedRef" }
        status_label: { $ref: "#/components/schemas/NestedRef" }
        company: { $ref: "#/components/schemas/NestedRef" }
        supplier: { $ref: "#/components/schemas/NestedRef" }
        rtd_location: { $ref: "#/components/schemas/NestedRef" }
        purchase_date: { $ref: "#/components/schemas/NestedDate" }
        # Set when the asset was soft-deleted; GET keeps returning trashed
        # assets, so a non-null value means the object is effectively gone.
        deleted_at: { $ref: "#/components/schemas/NestedDateTime" }
        warranty_months: { $ref: "#/components/schemas/FlexInt" }
        requestable: { $ref: "#/components/schemas/FlexBool" }
    HardwareList:
      type: object
      required: [total, rows]
      properties:
        total: { type: integer, format: int64 }
        rows:
          type: array
          items: { $ref: "#/components/schemas/Hardware" }
